# golangci-lint v2 configuration generated by finfocus plugin init.
# This filename is not auto-discovered; make lint and CI pass --config.
version: "2"

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mkutlak/finfocus-plugin-scaleway-public

linters:
  # Pin the set so a newer golangci-lint standard bundle cannot fail a fresh plugin.
  default: none
  enable:
    - errcheck
    - gosec
    - govet
    - ineffassign
    - staticcheck
    - unused
